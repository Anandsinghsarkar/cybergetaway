<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body { font-family: Arial; padding: 30px; background: #f5f5f5; }
    .stats { display: flex; gap: 20px; margin-bottom: 30px; }
    .stat { background: white; padding: 20px; border-radius: 8px; flex: 1; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .stat h3 { margin: 0; color: #666; font-size: 14px; }
    .stat p { margin: 8px 0 0; font-size: 28px; font-weight: bold; color: #4CAF50; }
    table { width: 100%; background: white; border-collapse: collapse; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #4CAF50; color: white; }
    .paid { color: green; font-weight: bold; }
    .pending { color: orange; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Payment Dashboard</h1>
  <div class="stats">
    <div class="stat"><h3>Total Received</h3><p id="total">₹0</p></div>
    <div class="stat"><h3>Paid Orders</h3><p id="paid">0</p></div>
    <div class="stat"><h3>Pending Orders</h3><p id="pending">0</p></div>
  </div>
  <table>
    <thead>
      <tr><th>Order ID</th><th>Amount</th><th>UPI Ref</th><th>Status</th><th>Date</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    async function load() {
      // Stats
      const s = await fetch('/api/orders/stats/summary').then(r => r.json());
      document.getElementById('total').innerText = '₹' + s.totalReceived;
      document.getElementById('paid').innerText = s.paidOrders;
      document.getElementById('pending').innerText = s.pendingOrders;

      // Orders
      const orders = await fetch('/api/orders').then(r => r.json());
      document.getElementById('rows').innerHTML = orders.map(o => `
        <tr>
          <td>${o.order_id}</td>
          <td>₹${o.amount}</td>
          <td>${o.upi_ref || '-'}</td>
          <td class="${o.status.toLowerCase()}">${o.status}</td>
          <td>${new Date(o.created_at).toLocaleString()}</td>
        </tr>
      `).join('');
    }
    load();
    setInterval(load, 30000); // har 30 sec refresh
  </script>
</body>
</html>
