<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Admin Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;background:#0b1220;color:#eaf0ff;font:15px Arial}.wrap{max-width:1100px;margin:auto}h1{margin:8px 0 22px}.panel,.stat{background:#141f33;border:1px solid #263957;border-radius:16px;padding:18px}.login{max-width:400px;margin:12vh auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat small{color:#9eb0ca}.stat strong{display:block;font-size:27px;margin-top:8px}input,button{padding:12px;border-radius:9px;border:1px solid #344968;background:#0e192b;color:#fff}button{cursor:pointer;background:#20c997;color:#06271e;font-weight:700;border:0}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:12px;border-bottom:1px solid #263957}th{color:#9eb0ca}.tablewrap{overflow:auto}.status{font-weight:bold}.pending,.unverified{color:#ffcb70}.paid{color:#62e6ae}.failed,.refunded{color:#ff9090}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}#error{color:#ff9d9d}
</style></head><body><div class="wrap">
<section id="login" class="panel login"><h1>Admin Login</h1><p>Private payment dashboard</p><form id="loginForm"><input id="password" type="password" placeholder="Admin password" required style="width:100%;margin-bottom:12px"><button style="width:100%">Sign in</button></form><p id="error"></p></section>
<section id="app" hidden><div class="toolbar"><h1>Payment Dashboard</h1><button id="logout">Logout</button></div>
<div class="stats"><div class="stat"><small>Total Received</small><strong id="total">₹0</strong></div><div class="stat"><small>Paid Orders</small><strong id="paid">0</strong></div><div class="stat"><small>Pending / Review</small><strong id="pending">0</strong></div></div>
<div class="panel"><div class="toolbar"><h2>Orders</h2><button id="refresh">Refresh</button></div><p id="error"></p><div class="tablewrap"><table><thead><tr><th>Order</th><th>Amount</th><th>UPI Ref</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></div>
<script>
const $=id=>document.getElementById(id);
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function cell(tr,value,cls){const td=document.createElement('td');td.textContent=value??'-';if(cls)td.className=cls;tr.appendChild(td);return td}
async function load(){try{const [s,orders]=await Promise.all([api('/api/orders/stats/summary'),api('/api/orders')]);$('total').textContent='₹'+Number(s.totalReceived).toFixed(2);$('paid').textContent=s.paidOrders;$('pending').textContent=s.pendingOrders;const body=$('rows');body.replaceChildren();for(const o of orders){const tr=document.createElement('tr');cell(tr,o.order_id);cell(tr,'₹'+o.amount);cell(tr,o.upi_ref);cell(tr,o.status,'status '+o.status.toLowerCase());cell(tr,new Date(o.created_at+'Z').toLocaleString());const td=document.createElement('td');if(['PENDING','UNVERIFIED'].includes(o.status)){const b=document.createElement('button');b.textContent='Verify & Mark Paid';b.onclick=async()=>{const ref=prompt('Confirm bank/app payment. UPI reference (optional):',o.upi_ref||'');if(ref===null)return;try{await api('/api/orders/'+encodeURIComponent(o.order_id)+'/mark-paid',{method:'PATCH',body:JSON.stringify({upiRef:ref})});load()}catch(e){$('error').textContent=e.message}};td.appendChild(b)}else td.textContent='—';tr.appendChild(td);body.appendChild(tr)}}catch(e){$('error').textContent=e.message}}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('login').hidden=true;$('app').hidden=false;$('error').textContent='';load()}catch(err){$('error').textContent=err.message}};
$('logout').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});location.reload()};
$('refresh').onclick=load;
api('/api/admin/session').then(()=>{$('login').hidden=true;$('app').hidden=false;load()}).catch(()=>{});
setInterval(()=>{if(!$('app').hidden)load()},30000);
</script></body></html>
