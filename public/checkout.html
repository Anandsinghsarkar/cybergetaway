<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure UPI Checkout</title><script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1220;color:#edf3ff;font:16px Arial;padding:18px}.card{width:min(100%,470px);background:#142139;border:1px solid #2b4162;border-radius:22px;padding:26px;text-align:center;box-shadow:0 18px 60px #0006}.muted{color:#a8bad3}.amount{font-size:38px;font-weight:800;margin:14px}a{display:inline-block;border:0;border-radius:12px;padding:14px 16px;background:#20c997;color:#05251c;font-weight:800;text-decoration:none;cursor:pointer}.apps{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.apps a{background:#243b5c;color:#edf3ff}.qr{background:white;padding:14px;width:max-content;margin:18px auto;border-radius:12px}#status{padding:10px;border-radius:10px;background:#20344f}.note{font-size:13px;line-height:1.5}
</style></head><body><main class="card"><div class="muted">SECURE UPI CHECKOUT</div><h2 id="merchant">Loading…</h2><div class="muted">Order <b id="order">—</b></div><div class="amount" id="amount">₹—</div><div id="qr" class="qr"></div><a id="upi" href="#">Pay using UPI app</a><div class="apps"><a id="gpay" href="#">Google Pay</a><a id="phonepe" href="#">PhonePe</a><a id="paytm" href="#">Paytm</a><a id="other" href="#">Other UPI app</a></div><p id="status">Loading payment details…</p><p class="muted note">After paying, keep this page open. Payment is confirmed only after the merchant checks the bank transaction and marks it paid. Never share your UPI PIN or OTP.</p></main>
<script>
const token=new URLSearchParams(location.search).get('token');const $=id=>document.getElementById(id);
(async()=>{try{if(!token)throw Error('Missing checkout token');const url='/api/gateway/checkout/'+encodeURIComponent(token);const r=await fetch(url);const d=await r.json();if(!r.ok)throw Error(d.error||'Checkout unavailable');
$('merchant').textContent=d.merchant_name;$('order').textContent=d.order_id;$('amount').textContent='₹'+Number(d.amount).toFixed(2);
const params=new URLSearchParams({pa:d.merchant_vpa,pn:d.merchant_name,am:Number(d.amount).toFixed(2),cu:'INR',tn:d.order_id});const link='upi://pay?'+params.toString();
['upi','gpay','phonepe','paytm','other'].forEach(id=>$(id).href=link);new QRCode($('qr'),{text:link,width:220,height:220});
const statusUrl=url;let finished=false;
const poll=async()=>{try{const x=await fetch(statusUrl);const now=await x.json();$('status').textContent=now.status==='PAID'?'Payment confirmed by merchant.':now.status==='FAILED'?'Payment marked failed.':now.status==='REFUNDED'?'Payment refunded.':'Waiting for merchant verification…';if(!finished&&['PAID','FAILED','REFUNDED'].includes(now.status)){finished=true;clearInterval(timer);if(d.return_url){const u=new URL(d.return_url);u.searchParams.set('orderId',d.order_id);u.searchParams.set('paymentStatus',now.status);location.href=u.toString()}}}catch{}};
$('status').textContent='Payment pending. Complete payment in your UPI app.';const timer=setInterval(poll,5000);poll();
}catch(e){$('status').textContent=e.message}})();
</script></body></html>
